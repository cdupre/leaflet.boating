<!DOCTYPE html>
<html>
<head>
  <title>Leaflet.Boating</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="icon" href="favicon.svg" />
  <style>
    html, body, .leaflet-container {
      height: 100%;
      width: 100%;
      margin: 0;
    }
  </style>

  <!-- leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- leaflet boating -->
  <link rel="stylesheet" href="./dist/L.Control.Boating.css" />
  <script src="./dist/L.Control.Boating.js"></script>

</head>
<body>
  <div id="map"></div>
  <script>

    const OSM = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    })

    const NOAA = L.tileLayer(
      "https://gis.charttools.noaa.gov/arcgis/rest/services/MarineChart_Services/NOAACharts" +
      "/MapServer/WMTS/tile/1.0.0/MarineChart_Services_NOAACharts" +
      "/default/default028mm/{z}/{y}/{x}.png", {
      zoomOffset: -2,
      minNativeZoom: 2,
      maxNativeZoom: 18,
      attribution: '&copy; <a href="https://nauticalcharts.noaa.gov/">NOAA Office of Coast Survey</a>'
    })

    const kartverket = L.tileLayer('https://cache.kartverket.no/v1/wmts/1.0.0/topo/default/webmercator/{z}/{y}/{x}.png', {
      attribution: '© Kartverket',
    })

    const marks = L.tileLayer('https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png')

    const map = L.map('map', {
      center: [47.2, -2.30],
      layers: [OSM, marks],
      zoom: 10,
    })

    L.control.layers({
      "OpenStreetMap": OSM,
      "NOAA Charts (US only)": NOAA,
      "Kartverket (Norway only)": kartverket
    }, {
      "Sea Marks": marks
    }).addTo(map)

    L.control.boating().addTo(map)

  </script>
</body>
</html>
