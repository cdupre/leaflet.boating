<!DOCTYPE html>
<html>
<head>
  <title>Leaflet.Boating (leaflet 2.0 ESM)</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <style>
    html, body, .leaflet-container {
      height: 100%;
      width: 100%;
      margin: 0;
    }
  </style>

  <!-- leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@2.0.0-alpha.1/dist/leaflet.css" />
  <script type="importmap">
  {
    "imports": {
      "leaflet": "https://unpkg.com/leaflet@2.0.0-alpha.1/dist/leaflet.js"
    }
  }
  </script>

  <!-- leaflet boating -->
  <link rel="stylesheet" href="../dist/L.Control.Boating.css" />

</head>
<body>
  <div id="map"></div>
  <script type="module">

    import { Map, TileLayer } from 'leaflet'
    import { ControlBoating, Boating } from '../dist/L.Control.Boating.esm.js'

    const baseMap = new TileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    })

    const map = new Map('map', {
      center: [47.2, -2.30],
      layers: [baseMap],
      zoom: 10,
    })

    new ControlBoating().addTo(map)
    new ControlBoating().addTo(map)

    const ctrl = Boating(map)

    document.addEventListener('keydown', e => {
      if (e.code === 'Space') {
        e.preventDefault()
        ctrl.trigger()
      }
    })

  </script>
</body>
</html>
