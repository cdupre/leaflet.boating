<!DOCTYPE html>
<html>
<head>
  <title>Leaflet.Boating</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <style>
    html, body, .leaflet-container {
      height: 100%;
      width: 100%;
      margin: 0;
    }
  </style>

  <!-- leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@2.0.0-alpha.1/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@2.0.0-alpha.1/dist/leaflet-global.js"></script>

  <!-- leaflet boating -->
  <link rel="stylesheet" href="../dist/L.Control.Boating.css" />
  <script src="../dist/L.Control.Boating.js"></script>

</head>
<body>
  <div id="map"></div>
  <script>

    const baseMap = new L.TileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    })

    const seaMarks = new L.TileLayer('https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png')

    const map = new L.Map('map', {
      center: [47.2, -2.30],
      layers: [baseMap, seaMarks],
      zoom: 10,
    })

    new L.Control.Boating().addTo(map)

  </script>
</body>
</html>
