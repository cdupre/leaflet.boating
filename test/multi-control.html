<!DOCTYPE html>
<html>
<head>
  <title>Leaflet.Boating (external-control)</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <style>
    .leaflet-container {
      height: 70vh;
      width: 70vw;
    }
  </style>

  <!-- leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script type="importmap">
  {
    "imports": {
      "leaflet": "https://unpkg.com/leaflet@1.9.4/dist/leaflet-src.esm.js"
    }
  }
  </script>

  <!-- leaflet boating -->
  <link rel="stylesheet" href="../dist/L.Control.Boating.css" />

</head>
<body>
  <button id="button">Click</button>
  <span id="state"></span>
  <div id="map"></div>
  <script type="module">

    import { Map, TileLayer } from 'leaflet'
    import { Boating, ControlBoating } from '../dist/L.Control.Boating.esm.js'

    const baseMap = new TileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    })

    const map = new Map('map', {
      center: [47.2, -2.30],
      layers: [baseMap],
      zoom: 10,
    })

    const boating = Boating(map)

    const $button = document.getElementById('button')
    const $state = document.getElementById('state')

    map.on('boating:statechange', e => {
      $state.textContent = e.state
    })

    $button.addEventListener('click', e => {
      boating.trigger()
    })

    document.addEventListener('keydown', e => {
      if (e.code === 'Space') {
        e.preventDefault()
        boating.trigger()
      }
    })

    new ControlBoating().addTo(map)

  </script>
</body>
</html>
